{% extends "portfolio/base.html" %}

{% block content %}
<div class="card"> 
    <h3>{{ uc.nome }}</h3>
    <p>{{ uc.docente.nome }}</p>
     <img 
        src="{{ uc.imagem }}" 
        alt="{{ uc.nome }}" 
        style="max-width: 300px; border-radius: 10px;"
    >

    <p>
        <a href="{{ uc.url_oficial }}" target="_blank">
            Página oficial
        </a>
</div>
{% endblock %}
