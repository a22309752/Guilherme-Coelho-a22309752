{% extends "portfolio/base.html" %}

{% block content %}

<h1>{{ titulo_pagina }}</h1>

{% if erro %}
    <p style="color: red;">{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Guardar</button>
</form>

<p>
    <a href="{% url 'lista_campeoes_colega' %}"class="btn">Cancelar</a>
</p>

{% endblock %}
